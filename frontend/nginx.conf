worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $uri $medinote_cache_control { default "no-store"; ~^/assets/ "public,max-age=31536000,immutable"; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1k;
    add_header Cache-Control $medinote_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    error_page 413 = @too_large;
    location @too_large { default_type application/json; return 413 '{"error":{"code":"BODY_TOO_LARGE","message":"Corps limité à 1 Kio.","retry_after_seconds":null},"request_id":"$request_id"}'; }
    location /api {
      set $medinote_api medinote-api:8000;
      proxy_pass http://$medinote_api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-MediNote-Client-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Real-IP "";
      proxy_read_timeout 65s;
      proxy_connect_timeout 5s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_store off;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
